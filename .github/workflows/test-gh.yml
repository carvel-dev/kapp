name: run all tests

on:
  push:
    branches:
      - develop
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  test-all:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        k8s-version: [1.27.0, 1.30.0, 1.31.0, 1.32.0]
    steps:
    - name: Create kind cluster v${{matrix.k8s-version}}
      uses: helm/kind-action@v1
      with:
        node_image: kindest/node:v${{ matrix.k8s-version }}
    - name: Verify kind
      run: |
        kind version
        kubectl version
    - name: Check out code into the Go module directory
      uses: actions/checkout@v4
      with:
        path: src/github.com/${{ github.repository }}
        fetch-depth: 0
    - name: Set up go
      uses: actions/setup-go@v5
      with:
        go-version-file: src/github.com/${{ github.repository }}/go.mod
    - name: Verify go version
      run: |
        go version
    - name: Run tests
      run: |
        set -e -x

        export GOPATH=$(pwd)
        pushd src/github.com/${{ github.repository }}

        # Install ytt for build
        mkdir -p /tmp/bin
        export PATH=/tmp/bin:$PATH

        ./hack/verify-no-dirty-files.sh

        wget -O- https://carvel.dev/install.sh | K14SIO_INSTALL_BIN_DIR=/tmp/bin bash

        # Ensure that there is no existing kapp installed
        rm -f /tmp/bin/kapp

        ./hack/build-binaries.sh

        export KAPP_E2E_NAMESPACE=kapp-test
        kubectl create ns $KAPP_E2E_NAMESPACE

        ./hack/test-all.sh
